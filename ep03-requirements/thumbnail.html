<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video 3 thumbnail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 1280x720 YouTube thumbnail, channel template: navy grid, yellow words left, diagram right with one red box.
   ?v=a  "ASK THIS FIRST"   ?v=b  "NEVER LOSE DATA?"   ?v=c  "SAME APP. 2 DESIGNS."
   Render: headless Chrome screenshot at 1280x720 (see the README). */
:root{--bg:#0f1726;--ink:#fff;--muted:#a9b6cc;--accent:#6f9fff;--hl:#ffc93c;--red:#ff5a46;--green:#4fc48d;--panel:#16213a}
html,body{margin:0;background:#000}
.t{width:1280px;height:720px;position:relative;overflow:hidden;background:radial-gradient(900px 600px at 85% 45%,#1e3a6e 0%,var(--bg) 60%);background-color:var(--bg);font-family:"Familjen Grotesk","Segoe UI",sans-serif;color:var(--ink);display:none}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(111,159,255,.08) 2px,transparent 2px),linear-gradient(90deg,rgba(111,159,255,.08) 2px,transparent 2px);background-size:64px 64px}
.txt{position:absolute;left:60px;top:80px;display:flex;flex-direction:column;gap:4px}
.huge{font-size:190px;line-height:.88;color:var(--hl);letter-spacing:-.035em;text-shadow:0 8px 0 rgba(0,0,0,.35)}
.mid{font-size:84px;line-height:1;letter-spacing:-.02em;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.sub{margin-top:22px;align-self:flex-start;font-family:"IBM Plex Mono",monospace;font-size:32px;background:var(--accent);color:#08101f;padding:10px 22px;border-radius:12px}
.box{position:absolute;height:92px;border:5px solid var(--muted);border-radius:18px;background:var(--panel);display:grid;place-items:center;font-size:38px;color:var(--ink);padding:0 24px;white-space:nowrap}
.box.red{border-color:var(--red);background:#3a1a1f;color:#ffd9d3;box-shadow:0 0 0 8px rgba(255,90,70,.25)}
.box.green{border-color:var(--green)}
.ln{position:absolute;background:var(--muted)}
.q{position:absolute;font-size:150px;color:var(--hl);line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.45)}
.badge{position:absolute;font-family:"IBM Plex Mono",monospace;font-size:30px;padding:6px 14px;border-radius:10px;background:var(--red);color:#fff}
.card{position:absolute;border:5px solid var(--accent);border-radius:22px;background:#0a0f1a;padding:26px 34px;font-size:52px;line-height:1.15;color:var(--ink);font-style:italic}
.lbl{position:absolute;font-family:"IBM Plex Mono",monospace;font-size:28px;color:var(--muted)}
</style>
</head>
<body>
<!-- A: the question -->
<div class="t" id="a">
  <div class="grid"></div>
  <div class="txt" style="top:110px"><span class="huge" style="font-size:155px">ASK THIS</span><span class="huge" style="font-size:155px">FIRST</span><span class="sub">system design interviews</span></div>
  <div class="card" style="left:790px;top:190px;width:380px">"What must <b style="color:var(--red);font-style:normal">never</b> go wrong?"</div>
</div>

<!-- B: durability -->
<div class="t" id="b">
  <div class="grid"></div>
  <div class="txt" style="top:120px"><span class="huge" style="font-size:150px">NEVER</span><span class="huge" style="font-size:150px">LOSE DATA?</span><span class="sub">one sentence, one new box</span></div>
  <div class="box red" style="left:880px;top:180px;width:300px">Database</div>
  <div class="ln" style="left:1026px;top:272px;width:8px;height:100px"></div>
  <div class="box green" style="left:880px;top:372px;width:300px">+ Replica</div>
</div>

<!-- C: same app, two designs -->
<div class="t" id="c">
  <div class="grid"></div>
  <div class="txt" style="top:100px"><span class="mid" style="font-size:110px">SAME APP.</span><span class="huge" style="font-size:150px">2 DESIGNS.</span><span class="sub">requirements decide</span></div>
  <span class="lbl" style="left:820px;top:120px">A</span>
  <div class="box" style="left:860px;top:100px;width:330px">3 boxes</div>
  <span class="lbl" style="left:820px;top:330px">B</span>
  <div class="box red" style="left:860px;top:310px;width:330px">9 boxes</div>
  <span class="q" style="left:1150px;top:430px">?</span>
</div>
<script>const v=(location.search.match(/v=([abc])/)||[,'a'])[1];document.getElementById(v).style.display='block'</script>
</body>
</html>
